[project]
name = "agent"
version = "0.0.1"
description = "DeepAgents enterprise procurement assistant with a Vue/FastAPI web UI."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "deepagents==0.7.18",
    "langchain==1.4.2",
    "langchain-core==1.6.4",
    "langchain-openai==1.1.12",
    "langchain-mcp-adapters==0.2.2",
    "nemoguardrails==0.24.1",
    "langgraph==1.2.12",
    "langgraph-checkpoint-mysql[aiomysql]==3.0.0",
    "aiomysql==0.3.2",
    # aiomysql 0.3.2 与 PyMySQL 1.2.x 的字节转义 API 不兼容。
    "PyMySQL==1.1.2",
    "opensandbox==0.1.7",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.42.0",
    "fastmcp==3.2.4",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "pydantic==2.12.5",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "requests==2.33.0",
    "prometheus-client==0.25.0",
    "opentelemetry-api==1.40.0",
    "opentelemetry-sdk==1.40.0",
    "opentelemetry-exporter-otlp==1.40.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
]

[project.scripts]
procurement-eval = "agent.evaluation.cli:main"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*", "api_view*", "mcp_server*"]
namespaces = true

[tool.setuptools.package-data]
agent = ["memory/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
